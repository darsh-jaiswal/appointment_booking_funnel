<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Your Discovery Call | Ayush</title>
  <link rel="icon" type="image/png" href="assets/placeholder-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:          #FBF9F6;
      --text-h:      #1E2D24;
      --text-b:      #3A443F;
      --green:       #3D6B4A;
      --green-light: #5A8A66;
      --green-muted: #C8D5C0;
      --green-pale:  #EBF2E8;
      --border:      #D7CDCC;
      --white:       #FFFFFF;
      --gray-text:   #9CA3A0;
      --serif:       'Playfair Display', Georgia, serif;
      --sans:        'DM Sans', system-ui, sans-serif;
      --shadow:      0 6px 30px rgba(30,45,36,.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text-b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ── Outer card (the whole booking widget) ── */
    .booking-card {
      display: grid;
      /* Three columns: info sidebar | calendar | time slots */
      grid-template-columns: 260px 1fr 200px;
      max-width: 900px;
      width: 100%;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 540px;
    }

    /* ── LEFT PANEL: coach info + selected date ── */
    .info-panel {
      background: var(--bg);
      border-right: 1px solid var(--border);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      isolation: isolate;
    }
    .info-logo {
      height: 44px;
      width: auto;
    }
    .info-title {
      font-family: var(--serif);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-h);
      line-height: 1.3;
    }
    .info-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .info-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .83rem;
      color: var(--text-b);
      opacity: .8;
    }
    .info-row svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--green); }

    .info-selected {
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
    .info-selected-label {
      font-size: .7rem;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 6px;
    }
    .info-selected-date {
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-h);
      line-height: 1.4;
    }
    .info-selected-time {
      font-size: .85rem;
      color: var(--green);
      font-weight: 500;
      margin-top: 4px;
    }

    /* ── CENTRE PANEL: calendar ── */
    .cal-panel {
      padding: 28px 24px;
      border-right: 1px solid var(--border);
    }
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .cal-month-label {
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-h);
    }
    .cal-nav-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-h);
      font-size: 1rem;
      transition: all .2s;
    }
    .cal-nav-btn:hover { background: var(--green-pale); border-color: var(--green-muted); }
    .cal-nav-btn:disabled { opacity: .3; cursor: not-allowed; }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 6px;
    }
    .cal-weekday {
      font-size: .7rem;
      font-weight: 500;
      text-align: center;
      color: var(--gray-text);
      letter-spacing: .05em;
      padding: 4px 0;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: .85rem;
      cursor: pointer;
      transition: all .2s;
      position: relative;
      color: var(--text-h);
    }
    /* Empty cell (padding before day 1) */
    .cal-day--empty { pointer-events: none; }
    /* Past days and unavailable days of week */
    .cal-day--disabled {
      color: var(--gray-text);
      cursor: not-allowed;
      opacity: .45;
    }
    /* Available days — light green background */
    .cal-day--available {
      background: var(--green-pale);
      color: var(--green);
      font-weight: 500;
    }
    .cal-day--available:hover {
      background: var(--green-muted);
    }
    /* Today */
    .cal-day--today {
      font-weight: 700;
    }
    /* Selected day — solid green */
    .cal-day--selected {
      background: var(--green) !important;
      color: var(--white) !important;
    }
    /* Days with a dot showing they have some bookings */
    .cal-day--has-dot::after {
      content: '';
      position: absolute;
      bottom: 3px;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--green-muted);
    }

    /* Timezone display at the bottom of the calendar */
    .cal-tz {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .76rem;
      color: var(--text-b);
      opacity: .6;
    }
    .cal-tz svg { width: 14px; height: 14px; }

    /* ── RIGHT PANEL: time slots ── */
    .slots-panel {
      padding: 28px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .slots-placeholder {
      font-size: .82rem;
      color: var(--gray-text);
      text-align: center;
      margin: auto;
      padding: 20px;
      line-height: 1.6;
    }
    .slots-loading {
      font-size: .82rem;
      color: var(--gray-text);
      text-align: center;
      margin: auto;
    }
    .slot-btn {
      width: 100%;
      padding: 10px 8px;
      border: 1.5px solid var(--green);
      border-radius: 8px;
      background: transparent;
      color: var(--green);
      font-family: var(--sans);
      font-size: .85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s;
    }
    .slot-btn:hover:not(:disabled) {
      background: var(--green-pale);
    }
    .slot-btn--selected {
      background: var(--green) !important;
      color: var(--white) !important;
    }
    .slot-btn:disabled {
      border-color: var(--border);
      color: var(--gray-text);
      cursor: not-allowed;
      background: transparent;
      text-decoration: line-through;
      opacity: .5;
    }
    /* The confirm button appears after picking a slot */
    .btn-confirm {
      width: 100%;
      margin-top: auto;
      padding: 13px;
      background: var(--green);
      color: var(--white);
      border: none;
      border-radius: 50px;
      font-family: var(--sans);
      font-size: .9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .3s;
      display: none;
    }
    .btn-confirm:hover:not(:disabled) {
      background: var(--text-h);
      transform: translateY(-1px);
    }
    .btn-confirm:disabled { opacity: .6; cursor: not-allowed; }

    /* Error banner inside the slots panel */
    .slot-error {
      font-size: .8rem;
      color: #b91c1c;
      background: #fee2e2;
      border-radius: 8px;
      padding: 8px 10px;
      display: none;
    }

    /* ── Responsive ── */
    @media (max-width: 760px) {
      body { padding: 16px; align-items: flex-start; }
      .booking-card {
        grid-template-columns: 1fr;
        border-radius: 16px;
      }
      .info-panel { border-right: none; border-bottom: 1px solid var(--border); }
      .cal-panel  { border-right: none; border-bottom: 1px solid var(--border); }
      .info-selected { margin-top: 16px; }
    }
  </style>
</head>
<body>

<div class="booking-card">

  <!-- ════ LEFT: Info Panel ════ -->
  <div class="info-panel">

    <div class="info-title">Book Your Discovery Call</div>

    <div class="info-meta">
      <!-- Duration -->
      <div class="info-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 3" stroke-linecap="round"/>
        </svg>
        <span id="durationLabel">20 min</span>
      </div>
      <!-- Location -->
      <div class="info-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M15 10a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
        </svg>
        <span>Online via Google Meet or WhatsApp</span>
      </div>
    </div>

    <!-- Shows the chosen date & time once user picks them -->
    <div class="info-selected">
      <div class="info-selected-label">Selected slot</div>
      <div class="info-selected-date" id="selectedDateDisplay">No date chosen yet</div>
      <div class="info-selected-time" id="selectedTimeDisplay"></div>
    </div>
  </div>

  <!-- ════ CENTRE: Calendar ════ -->
  <div class="cal-panel">
    <div class="cal-header">
      <button class="cal-nav-btn" id="prevMonth" aria-label="Previous month">&#8249;</button>
      <span class="cal-month-label" id="monthLabel"></span>
      <button class="cal-nav-btn" id="nextMonth" aria-label="Next month">&#8250;</button>
    </div>

    <div class="cal-weekdays">
      <div class="cal-weekday">Sun</div>
      <div class="cal-weekday">Mon</div>
      <div class="cal-weekday">Tue</div>
      <div class="cal-weekday">Wed</div>
      <div class="cal-weekday">Thu</div>
      <div class="cal-weekday">Fri</div>
      <div class="cal-weekday">Sat</div>
    </div>

    <!-- Day cells are drawn here by JavaScript -->
    <div class="cal-grid" id="calGrid"></div>

    <!-- Show the user's timezone so they know what time zone the slots are in -->
    <div class="cal-tz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        <path d="M2 12h20"/>
      </svg>
      <span id="tzLabel">IST (GMT+5:30)</span>
    </div>
  </div>

  <!-- ════ RIGHT: Time Slots ════ -->
  <div class="slots-panel" id="slotsPanel">
    <p class="slots-placeholder" id="slotsPlaceholder">
      ← Pick a date to see available times
    </p>
    <div class="slot-error" id="slotError"></div>
    <!-- Slot buttons are inserted here by JavaScript -->
    <div id="slotsList"></div>
    <button class="btn-confirm" id="confirmBtn">Confirm Booking →</button>
  </div>

</div>


<!-- ════════════════════════════════════════════════════════
  PLAIN ENGLISH — HOW THE CALENDAR WORKS:

  The calendar is drawn by JavaScript — no plugin or library needed.
  Here's the logic step by step:

  1. We figure out what day of the week the 1st falls on.
     (e.g. if June 1st is a Monday, we leave 1 empty cell before it.)

  2. We loop through all the days and mark each one:
     - Is it in the past? → gray it out (can't book it)
     - Is it a weekend (if weekends are disabled)? → gray it out
     - Is it more than 30 days from today? → gray it out
     - Otherwise → light green = available, click to select

  3. When a date is clicked, we ask Supabase:
     "Which time slots are already booked for this date?"
     Supabase responds with a list of UTC timestamps.

  4. We compare those booked times against the AVAILABLE_HOURS
     in config.js. Slots that are taken become disabled buttons.

  5. When the user picks a slot and clicks "Confirm Booking",
     we save the appointment to Supabase and redirect to
     confirmed.html. From there the visitor is offered the short
     questionnaire (funnel.html) before they're fully done.
════════════════════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="secrets.js"></script>
<script src="config.js"></script>
<script>

  // ── Initialise Supabase ──────────────────────────────────────
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  // ── Availability (overridden from Supabase settings if present) ─
  let availHours = [...AVAILABLE_HOURS]
  let availDays  = [...AVAILABLE_DAYS]

  // ── Get the lead's details (saved by register.html) ──────────
  // If someone lands directly on book.html (skipping the form),
  // leadData will be null — we still let them book, just without name association.
  let leadData = null
  try { leadData = JSON.parse(sessionStorage.getItem('leadData') || 'null') } catch {}

  // ── Calendar state ───────────────────────────────────────────
  const today = new Date()
  today.setHours(0, 0, 0, 0)    // strip time so comparisons are date-only

  let viewYear  = today.getFullYear()
  let viewMonth = today.getMonth()   // 0 = January … 11 = December
  let selectedDateStr = null         // e.g. "2026-06-10"
  let selectedHour    = null         // e.g. 8 (for 8:00 AM IST)

  // ── Set up session duration label ────────────────────────────
  document.getElementById('durationLabel').textContent = `${SESSION_DURATION_MINUTES} min`

  // ── Render the calendar for a given year/month ───────────────
  function renderCalendar(year, month) {
    const MONTH_NAMES = ['January','February','March','April','May','June',
                         'July','August','September','October','November','December']

    document.getElementById('monthLabel').textContent = `${MONTH_NAMES[month]} ${year}`

    // Disable "previous month" button if we're already on the current month
    document.getElementById('prevMonth').disabled =
      (year === today.getFullYear() && month === today.getMonth())

    const grid = document.getElementById('calGrid')
    grid.innerHTML = ''   // clear previous month

    // Figure out what day of the week the 1st falls on (0=Sun … 6=Sat)
    const firstDayOfMonth = new Date(year, month, 1).getDay()
    // How many days are in this month?
    const daysInMonth = new Date(year, month + 1, 0).getDate()

    // The farthest-out date the user can book
    const maxDate = new Date(today)
    maxDate.setDate(maxDate.getDate() + BOOKING_WINDOW_DAYS)

    // Add empty placeholder cells so day 1 lands on the right column
    for (let i = 0; i < firstDayOfMonth; i++) {
      const empty = document.createElement('div')
      empty.className = 'cal-day cal-day--empty'
      grid.appendChild(empty)
    }

    // Draw each day of the month
    for (let d = 1; d <= daysInMonth; d++) {
      const cellDate = new Date(year, month, d)
      cellDate.setHours(0, 0, 0, 0)

      const dateStr = formatDate(year, month + 1, d)  // "2026-06-10"
      const dayOfWeek = cellDate.getDay()              // 0=Sun … 6=Sat

      const isToday     = cellDate.getTime() === today.getTime()
      const isPast      = cellDate < today
      const isTooFar    = cellDate > maxDate
      const isAvailDay  = availDays.includes(dayOfWeek)
      const isSelected  = dateStr === selectedDateStr

      const cell = document.createElement('div')
      cell.textContent = d
      cell.className = 'cal-day'

      if (isToday) cell.classList.add('cal-day--today')

      if (isPast || isTooFar || !isAvailDay) {
        cell.classList.add('cal-day--disabled')
      } else if (isSelected) {
        cell.classList.add('cal-day--selected')
      } else {
        cell.classList.add('cal-day--available')
        cell.addEventListener('click', () => onDateSelected(dateStr, cell))
      }

      grid.appendChild(cell)
    }
  }

  // ── Called when user clicks an available day ─────────────────
  async function onDateSelected(dateStr, clickedCell) {
    selectedDateStr = dateStr
    selectedHour    = null   // reset any previously chosen time

    // Visually highlight the selected cell
    document.querySelectorAll('.cal-day--selected').forEach(el => {
      el.classList.remove('cal-day--selected')
      el.classList.add('cal-day--available')
    })
    clickedCell.classList.add('cal-day--selected')
    clickedCell.classList.remove('cal-day--available')

    // Update the info panel on the left
    document.getElementById('selectedDateDisplay').textContent = formatDisplayDate(dateStr)
    document.getElementById('selectedTimeDisplay').textContent = ''

    // Show loading in the slots panel
    const slotsList = document.getElementById('slotsList')
    const placeholder = document.getElementById('slotsPlaceholder')
    placeholder.style.display = 'none'
    slotsList.innerHTML = '<p class="slots-loading">Loading available times…</p>'
    document.getElementById('confirmBtn').style.display = 'none'
    document.getElementById('slotError').style.display = 'none'

    // Ask Supabase which slots are already taken for this date
    // We call a database "function" called get_booked_slots that safely
    // returns only the taken timestamps — no personal data exposed.
    const { data: bookedSlots, error } = await db
      .rpc('get_booked_slots', { check_date: dateStr })

    if (error) {
      slotsList.innerHTML = ''
      document.getElementById('slotError').textContent = 'Could not load times. Please refresh.'
      document.getElementById('slotError').style.display = 'block'
      return
    }

    // Convert booked slot timestamps to Date objects for easy comparison
    const bookedTimes = (bookedSlots || []).map(row => new Date(row.slot_time).getTime())

    renderSlots(dateStr, bookedTimes)
  }

  // ── Draw the time slot buttons ───────────────────────────────
  function renderSlots(dateStr, bookedTimes) {
    const slotsList = document.getElementById('slotsList')
    slotsList.innerHTML = ''

    availHours.forEach(hour => {
      // Build the UTC timestamp for "this hour on this date in IST"
      // "+05:30" tells JavaScript this time is in IST (UTC+5:30)
      const slotTime = new Date(`${dateStr}T${pad(hour)}:00:00+05:30`)
      const isBooked = bookedTimes.includes(slotTime.getTime())
      const isPast   = slotTime.getTime() <= Date.now()

      const btn = document.createElement('button')
      btn.className = 'slot-btn'
      btn.textContent = formatHour(hour)
      btn.disabled = isBooked || isPast

      if (!isBooked && !isPast) {
        btn.addEventListener('click', () => onSlotSelected(hour, btn))
      }

      slotsList.appendChild(btn)
    })
  }

  // ── Called when user clicks a time slot ─────────────────────
  function onSlotSelected(hour, clickedBtn) {
    selectedHour = hour

    // Highlight only the clicked button
    document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('slot-btn--selected'))
    clickedBtn.classList.add('slot-btn--selected')

    // Update info panel
    document.getElementById('selectedTimeDisplay').textContent = formatHour(hour) + ' IST'

    // Show the confirm button
    const confirmBtn = document.getElementById('confirmBtn')
    confirmBtn.style.display = 'block'
  }

  // ── Confirm and save the booking ─────────────────────────────
  document.getElementById('confirmBtn').addEventListener('click', async () => {
    if (!selectedDateStr || selectedHour === null) return

    const confirmBtn = document.getElementById('confirmBtn')
    confirmBtn.disabled = true
    confirmBtn.textContent = 'Booking…'

    // Build the UTC timestamp for the appointment
    // This is what gets stored in the database
    const scheduledAt = new Date(`${selectedDateStr}T${pad(selectedHour)}:00:00+05:30`)

    // Save the appointment to Supabase
    const { error } = await db
      .from('appointments')
      .insert({
        first_name:         leadData?.firstName  || null,
        email:              leadData?.email      || null,
        phone:              leadData?.phone      || null,
        scheduled_at:       scheduledAt.toISOString(),
        timezone:           'Asia/Kolkata',
        duration_minutes:   SESSION_DURATION_MINUTES,
        status:             'confirmed'
      })

    if (error) {
      confirmBtn.disabled = false
      confirmBtn.textContent = 'Confirm Booking →'
      document.getElementById('slotError').textContent =
        'Could not save your booking. Please try again.'
      document.getElementById('slotError').style.display = 'block'
      return
    }

    // Save booking details so confirmed.html can display them
    sessionStorage.setItem('bookingData', JSON.stringify({
      firstName:   leadData?.firstName || 'there',
      email:       leadData?.email     || '',
      dateStr:     selectedDateStr,
      hour:        selectedHour,
      isoUTC:      scheduledAt.toISOString(),
      duration:    SESSION_DURATION_MINUTES
    }))

    // Fire edge functions with keepalive:true so the browser doesn't cancel
    // them when we immediately navigate to confirmed.html
    const fnHeaders = {
      'Content-Type':  'application/json',
      'apikey':        SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    }
    const fnBase = `${SUPABASE_URL}/functions/v1`

    fetch(`${fnBase}/send-confirmation`, {
      method: 'POST', keepalive: true, headers: fnHeaders,
      body: JSON.stringify({
        firstName: leadData?.firstName || 'there',
        email:     leadData?.email     || '',
        dateStr:   selectedDateStr,
        hour:      selectedHour,
        duration:  SESSION_DURATION_MINUTES
      })
    })

    fetch(`${fnBase}/create-calendar-event`, {
      method: 'POST', keepalive: true, headers: fnHeaders,
      body: JSON.stringify({
        firstName: leadData?.firstName || 'Client',
        email:     leadData?.email     || '',
        phone:     leadData?.phone     || '',
        dateStr:   selectedDateStr,
        hour:      selectedHour,
        duration:  SESSION_DURATION_MINUTES
      })
    })

    // Booking is saved — take the visitor to the confirmation page.
    // keepalive ensures the fetches above still complete after we navigate.
    window.location.href = 'confirmed.html'
  })

  // ── Month navigation ─────────────────────────────────────────
  document.getElementById('prevMonth').addEventListener('click', () => {
    viewMonth--
    if (viewMonth < 0) { viewMonth = 11; viewYear-- }
    selectedDateStr = null   // reset selection when changing month
    selectedHour    = null
    renderCalendar(viewYear, viewMonth)
    resetSlotsPanel()
  })

  document.getElementById('nextMonth').addEventListener('click', () => {
    viewMonth++
    if (viewMonth > 11) { viewMonth = 0; viewYear++ }
    selectedDateStr = null
    selectedHour    = null
    renderCalendar(viewYear, viewMonth)
    resetSlotsPanel()
  })

  function resetSlotsPanel() {
    document.getElementById('slotsPlaceholder').style.display = ''
    document.getElementById('slotsList').innerHTML = ''
    document.getElementById('confirmBtn').style.display = 'none'
    document.getElementById('slotError').style.display = 'none'
    document.getElementById('selectedDateDisplay').textContent = 'No date chosen yet'
    document.getElementById('selectedTimeDisplay').textContent = ''
  }

  // ── Timezone label ───────────────────────────────────────────
  // Show the user's local timezone so they understand what "8:00 AM" means
  const userTZ = Intl.DateTimeFormat().resolvedOptions().timeZone
  const tzOffset = new Date().toLocaleTimeString('en', { timeZoneName: 'short' }).split(' ').pop()
  document.getElementById('tzLabel').textContent = `Times shown in IST (GMT+5:30)`

  // ── Helpers ──────────────────────────────────────────────────
  function pad(n) { return String(n).padStart(2, '0') }

  function formatDate(y, m, d) {
    return `${y}-${pad(m)}-${pad(d)}`
  }

  function formatDisplayDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number)
    const date = new Date(y, m - 1, d)
    return date.toLocaleDateString('en-IN', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    })
  }

  function formatHour(h) {
    const suffix = h >= 12 ? 'PM' : 'AM'
    const h12    = h === 0 ? 12 : h > 12 ? h - 12 : h
    return `${pad(h12)}:00 ${suffix}`
  }

  // ── Kick everything off — load settings from Supabase first ──
  ;(async () => {
    try {
      const { data } = await db.from('settings').select('setting_key,setting_val')
      if (data) {
        const h = data.find(r => r.setting_key === 'available_hours')
        const d = data.find(r => r.setting_key === 'available_days')
        if (h?.setting_val?.length) availHours = h.setting_val
        if (d?.setting_val?.length) availDays  = d.setting_val
      }
    } catch {}
    renderCalendar(viewYear, viewMonth)
  })()

</script>

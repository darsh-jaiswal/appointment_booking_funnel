<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch This Before Your Call | Ayush</title>
  <link rel="icon" type="image/png" href="assets/placeholder-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fast.wistia.net" crossorigin />

  <style>
    :root {
      --bg:          #FBF9F6;
      --text-h:      #1E2D24;
      --text-b:      #3A443F;
      --green:       #3D6B4A;
      --border:      #D7CDCC;
      --white:       #FFFFFF;
      --serif:       'Playfair Display', Georgia, serif;
      --sans:        'DM Sans', system-ui, sans-serif;
      --shadow:      0 6px 30px rgba(30,45,36,.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text-b);
      min-height: 100vh;
    }

    /* Logo bar */
    .top-bar {
      text-align: center;
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--white);
    }
    .top-bar img { height: 44px; mix-blend-mode: multiply; }

    .page-wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 48px 24px 72px;
      text-align: center;
    }

    .eyebrow {
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 14px;
    }

    .headline {
      font-family: var(--serif);
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-h);
      line-height: 1.22;
      margin-bottom: 12px;
    }

    .subline {
      font-size: 1rem;
      color: var(--text-b);
      line-height: 1.6;
      opacity: .8;
      max-width: 600px;
      margin: 0 auto 32px;
    }

    /* Responsive 16:9 video frame */
    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1C2B22;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Continue button */
    .continue-row { margin-top: 36px; }
    .btn-continue {
      display: inline-block;
      padding: 15px 40px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all .3s;
    }
    .btn-continue:hover {
      background: var(--text-h);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(30,45,36,.22);
    }
    .continue-note {
      font-size: .8rem;
      color: var(--text-b);
      opacity: .55;
      margin-top: 12px;
    }

    @media (max-width: 720px) {
      .page-wrap { padding: 32px 18px 56px; }
      .headline { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<!-- Logo -->
<div class="top-bar">
  <img src="assets/placeholder-logo.svg" alt="Ayush, Diabetes Freedom Coach" />
</div>

<div class="page-wrap">
  <p class="eyebrow">Watch this first</p>
  <h1 class="headline">How to Reverse Type 2 Diabetes and Get HbA1c Below 6.4%</h1>
  <p class="subline">A short walkthrough of the 90 day method before you choose a time for your free discovery call.</p>

  <!-- Wistia video (media id: ecqmz3y2zi) -->
  <div class="video-frame">
    <iframe
      src="https://fast.wistia.net/embed/iframe/ecqmz3y2zi?seo=true&videoFoam=false&playerColor=3D6B4A"
      title="How to Reverse Type 2 Diabetes and Get HbA1c Below 6.4%"
      allow="autoplay; fullscreen"
      allowtransparency="true"
      frameborder="0"
      scrolling="no"
      class="wistia_embed"
      name="wistia_embed"
      allowfullscreen></iframe>
  </div>

  <div class="continue-row">
    <a href="book.html" class="btn-continue">Continue to Choose Your Time →</a>
    <p class="continue-note">Your details are saved. Next, pick a slot that suits you.</p>
  </div>
</div>

</body>
</html>
